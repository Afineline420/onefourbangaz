
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OnefourBangaz Pokie</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #f8c400;
      text-align: center;
      padding: 60px 20px;
    }
    input, button {
      padding: 10px 15px;
      margin: 10px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
    }
    button {
      background-color: #f8c400;
      color: #000;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <h1>🎰 OnefourBangaz</h1>
  <p>Enter your username to begin:</p>
  <input type="text" id="username" placeholder="Your name" />
  <button onclick="startGame()">Start</button>
  <div id="game" style="display:none;">
    <h2>Balance: $<span id="balance">5.00</span></h2>
    <button onclick="spin()">SPIN</button>
    <p id="result"></p>
  </div>

  <script>
    let balance = 5.00;
    function startGame() {
      document.getElementById('game').style.display = 'block';
      document.getElementById('balance').innerText = balance.toFixed(2);
    }
    function spin() {
      const win = Math.random() < 0.3;
      const amount = win ? Math.floor(Math.random() * 100) + 1 : -1 * (Math.random() * 2);
      balance += amount;
      if (balance < 0) balance = 0;
      document.getElementById('balance').innerText = balance.toFixed(2);
      document.getElementById('result').innerText = win ? "WIN: $" + amount.toFixed(2) : "Lose!";
    }
  </script>
</body>
</html>
